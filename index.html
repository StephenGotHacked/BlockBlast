<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🌸 Nanay Saling's Block Puzzle 🌸</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="game-container">

    <!-- Header -->
    <header class="top-bar">

        <div class="logo">
            🌸 Nanay Saling's Block Puzzle
        </div>

        <div class="score-box">

            <div class="score-label">
                Score
            </div>

            <div id="score">
                0
            </div>

        </div>

    </header>

    <!-- Game Board -->

    <main>

        <div id="board"></div>

    </main>

    <!-- Pieces -->

    <section class="piece-area">

        <div id="piece1" class="piece-slot"></div>

        <div id="piece2" class="piece-slot"></div>

        <div id="piece3" class="piece-slot"></div>

    </section>

</div>

<!-- Welcome Popup -->

<div id="welcomePopup" class="popup">

    <div class="popup-card">
        <h1>
            <center>Welcome <br>Nanay Saling </center>❤️
        </h1>
        

        <p>

            Relax...
            Enjoy your puzzle game!

        </p>

        <button id="playBtn">

            Play

        </button>

    </div>

</div>

<div id="gameOverModal" class="modal hidden">
    <div class="modal-content">

        <h2>No More Moves!</h2>

        <p>Your Score</p>

        <h1 id="finalScore">0</h1>

        <button id="restartBtn">
            Start New Game
        </button>

    </div>
</div>

<!-- Scripts -->

<script src="js/storage.js"></script>
<script src="js/score.js"></script>

<script src="js/board.js"></script>
<script src="js/blocks.js"></script>

<script src="js/placement.js"></script>
<script src="js/clear.js"></script>

<script src="js/game.js"></script>
<script src="js/drag.js"></script>

<script src="js/effects.js"></script>

<script src="js/script.js"></script>

</body>
</html>
